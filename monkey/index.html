<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zen Monkey</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="bg-top"></div>
  <div class="bg-bottom"></div>

  <canvas id="scene"></canvas>

  <header class="intro">
    <h1>Zen Monkey</h1>
    <p>A calm 3D monkey who turns to face wherever your banana goes.</p>
  </header>

  <button id="export" class="export" type="button">Download 3D model (.glb)</button>

  <!-- Banana cursor -->
  <div id="banana" class="banana" aria-hidden="true">
    <svg viewBox="0 0 64 64" width="56" height="56">
      <path d="M10 14c4 20 18 34 40 36 4 0 6-3 3-5-16-4-28-16-33-32-1-4-11-4-10 1z"
            fill="#ffd23f" stroke="#7a5a00" stroke-width="2" stroke-linejoin="round"/>
      <path d="M14 18c6 16 17 26 33 30" fill="none" stroke="#e8b400" stroke-width="2" stroke-linecap="round"/>
      <path d="M9 13l-3-5 6 1z" fill="#5b4300"/>
      <circle cx="52" cy="47" r="2" fill="#5b4300"/>
    </svg>
  </div>

  <script type="module" src="monkey.js"></script>
</body>
</html>
