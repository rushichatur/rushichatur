name: Kharcha Android build

on:
  push:
    paths:
      - "kharcha/**"
      - ".github/workflows/kharcha-android.yml"
  pull_request:
    paths:
      - "kharcha/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kharcha
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Kharcha.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kharcha-apk
          path: kharcha/Kharcha.apk
