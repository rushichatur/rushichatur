# Builds an installable Android APK of openGym (https://github.com/DuarteSantos8/openGym)
# from its official source, and publishes it as a GitHub Release in this repo so it can be
# downloaded straight onto a phone.
#
# openGym is AGPL-3.0 (exercise media licensed separately, see its NOTICE.md). This workflow
# only builds the upstream code; nothing from it is copied into this repository.
#
# Signing: Android only installs signed APKs, and updates must be signed with the same key.
#   - With repo secrets ANDROID_KEYSTORE_B64 (base64 of a .jks), ANDROID_KEYSTORE_PASSWORD and
#     ANDROID_KEY_ALIAS set, every build is signed with that key, so new builds install over
#     old ones.
#   - Without them, a one-off key is generated for that run. The APK installs fine, but a
#     later build will not install over it (uninstall first, which deletes the app's data).

name: Build openGym APK

on:
  push:
    branches: [claude/lucid-shannon-agw05p]
    paths: [.github/workflows/build-opengym-apk.yml]
  workflow_dispatch:
    inputs:
      ref:
        description: openGym tag or branch to build
        default: v1.4.3
        required: true

permissions:
  contents: write # to publish the GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENGYM_REF: ${{ inputs.ref || 'v1.4.3' }}
    steps:
      - name: Check out openGym
        uses: actions/checkout@v4
        with:
          repository: DuarteSantos8/openGym
          ref: ${{ env.OPENGYM_REF }}
          path: opengym

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the mobile web bundle
        working-directory: opengym/frontend
        run: |
          npm ci
          npm run build:mobile
          echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # Our APK is signed with a different key than the official one. With the same app id,
      # phones that already have (or once had) the official openGym refuse it, often as
      # "package appears to be invalid". A distinct id lets it install next to any other copy.
      - name: Give the app its own id
        working-directory: opengym/frontend/android
        run: |
          sed -i 's/applicationId "ch.duartesantos.opengym"/applicationId "ch.duartesantos.opengym.personal"/' app/build.gradle
          grep -q 'applicationId "ch.duartesantos.opengym.personal"' app/build.gradle

      - name: Build the APK (Gradle)
        working-directory: opengym/frontend/android
        run: ./gradlew --no-daemon assembleSideloadRelease

      - name: Sign the APK
        working-directory: opengym/frontend/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "Signing with the keystore from repo secrets."
            echo "$KS_B64" | base64 -d > "$KS"
            echo "SIGNED_WITH=your saved key (repo secrets)" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: signing with a one-off key. Later builds will not install over this one."
            KS_PASS="$(openssl rand -hex 24)"
            KS_ALIAS=opengym
            keytool -genkeypair -noprompt -keystore "$KS" -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 4096 -validity 10950 \
              -dname "CN=openGym personal build"
            echo "SIGNED_WITH=a one-off key (uninstall before installing a newer build)" >> "$GITHUB_ENV"
          fi
          "$BT/zipalign" -f -p 4 \
            app/build/outputs/apk/sideload/release/app-sideload-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" \
            --key-pass env:KS_PASS --out "$GITHUB_WORKSPACE/openGym-$APP_VERSION.apk" aligned.apk
          rm -f "$KS"
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/openGym-$APP_VERSION.apk"
          cd "$GITHUB_WORKSPACE"
          sha256sum "openGym-$APP_VERSION.apk" > "openGym-$APP_VERSION.apk.sha256"
          ls -lh openGym-*

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openGym-${{ env.APP_VERSION }}-apk
          path: openGym-${{ env.APP_VERSION }}.apk*
          compression-level: 0

      - name: Publish a GitHub Release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="opengym-$APP_VERSION-build$GITHUB_RUN_NUMBER"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "openGym $APP_VERSION (Android APK, build $GITHUB_RUN_NUMBER)" \
            --notes "Android APK of [openGym](https://github.com/DuarteSantos8/openGym) $OPENGYM_REF, built from the official source by this repo's workflow.

          **Install:** open this page on your Android phone, tap \`openGym-$APP_VERSION.apk\`, wait for the download to finish completely, then open it and allow installs from your browser when Android asks. App id: \`ch.duartesantos.opengym.personal\`, so it installs next to any other openGym.

          Signed with $SIGNED_WITH. openGym is AGPL-3.0; source: https://github.com/DuarteSantos8/openGym/tree/$OPENGYM_REF" \
            "openGym-$APP_VERSION.apk" "openGym-$APP_VERSION.apk.sha256"
