<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Venuely – Event Layout Studio</title>
  <meta name="description" content="Plan event layouts in a flat 2D plan with a live isometric preview: stages, truss, tents, seating arrays, zones and roads.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M16 6l9 5v10l-9 5-9-5V11z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M7 11l9 5 9-5M16 16v10' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="stage">
    <canvas id="cv" tabindex="0"></canvas>
    <div id="dropMask" class="drop-mask">Drop to place</div>
  </main>

  <!-- left rail -->
  <nav id="rail" class="float" aria-label="Main"></nav>

  <!-- left panel: library / layers / summary -->
  <aside id="left" class="float panel">
    <div class="panel-head">
      <h2 id="leftTitle">Library</h2>
      <button class="icon-btn" id="leftClose" title="Hide panel"></button>
    </div>
    <div class="tabpane on" id="paneAssets">
      <div class="search"><input id="assetSearch" placeholder="Search items (Ctrl+K)" spellcheck="false" autocomplete="off"></div>
      <div id="assetList"></div>
    </div>
    <div class="tabpane" id="paneLayers"></div>
    <div class="tabpane" id="paneSummary"></div>
  </aside>

  <!-- top centre: plan name -->
  <header id="topchip" class="float">
    <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#2563eb"/><path d="M16 6l9 5v10l-9 5-9-5V11z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M7 11l9 5 9-5M16 16v10" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
    <input id="planName" class="plan-name" spellcheck="false" aria-label="Plan name">
    <span id="saved" class="saved" title="Your plan is saved in this browser automatically">Saved</span>
    <button class="icon-btn" id="btnSettings" title="Plan settings"></button>
  </header>

  <!-- top right -->
  <div id="topright">
    <button class="btn primary" id="btnShare"></button>
  </div>

  <!-- properties (appears when something is selected) -->
  <aside id="right" class="float panel" hidden>
    <div id="props"></div>
  </aside>

  <!-- bottom toolbar -->
  <div id="toolbar" class="float"></div>
  <div id="hint" class="hint"></div>

  <!-- bottom right: view switcher + zoom -->
  <div id="corner">
    <div id="mini" class="mini" role="button" tabindex="0" aria-label="Switch between plan and isometric view">
      <canvas id="miniCv"></canvas>
      <span class="mini-tag" id="miniTag"></span>
      <span class="mini-swap" id="miniSwap"></span>
    </div>
    <div id="zoomBox" class="float zoombox"></div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <h2>Start a layout</h2>
          <p>Pick a template to customise, or start from a blank plot.</p>
        </div>
        <button class="icon-btn" id="modalClose" title="Close">✕</button>
      </div>
      <div id="tplGrid" class="tpl-grid"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <input type="file" id="fileOpen" accept=".json,application/json" hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
