<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Venuely – Event Layout Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M16 6l9 5v10l-9 5-9-5V11z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M7 11l9 5 9-5M16 16v10' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f6fa;
  --panel: #ffffff;
  --line: #e4e8ef;
  --line-2: #d5dbe5;
  --ink: #1b2330;
  --ink-2: #5b6678;
  --ink-3: #8a94a6;
  --accent: #4f46e5;
  --accent-2: #eef0ff;
  --danger: #e5484d;
  --radius: 10px;
  --shadow: 0 6px 24px rgba(20, 30, 60, .14), 0 1px 3px rgba(20, 30, 60, .08);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-size: 13px; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ---- top bar ---- */
#topbar { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; letter-spacing: -.02em; }
.plan-name { width: 190px; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 6px 8px; font-weight: 600; }
.plan-name:hover { border-color: var(--line-2); } .plan-name:focus { outline: none; border-color: var(--accent); background: #fff; }
.grow { flex: 1; }
.tb-group { display: flex; gap: 2px; align-items: center; }
.tb-sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
.icon-btn, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; min-width: 32px; padding: 0 8px; border: 1px solid transparent; background: transparent; border-radius: 8px; color: var(--ink); white-space: nowrap; }
.icon-btn:hover, .btn:hover { background: #eef1f6; }
.icon-btn:disabled { opacity: .35; cursor: default; background: transparent; }
.icon-btn.on { background: var(--accent-2); color: var(--accent); }
.icon-btn svg, .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn { border-color: var(--line-2); padding: 0 12px; font-weight: 600; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: #4338ca; }
.btn.danger { color: var(--danger); }
.seg { display: inline-flex; background: #eef1f6; padding: 3px; border-radius: 9px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; font-weight: 600; color: var(--ink-2); }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.only-narrow { display: none; }

/* ---- layout ---- */
#app { height: calc(100% - 52px); display: grid; grid-template-columns: 290px 1fr 300px; }
.panel { background: var(--panel); border-right: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
#right { border-right: 0; border-left: 1px solid var(--line); overflow-y: auto; }
#stage { position: relative; overflow: hidden; background: #e9f1f7; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
.floating { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
#toolbar { left: 12px; top: 12px; display: flex; flex-direction: column; padding: 4px; gap: 2px; }
.zoombox { right: 12px; bottom: 12px; display: flex; align-items: center; padding: 3px; gap: 1px; }
.zoombox .zl { min-width: 48px; text-align: center; font-weight: 600; font-size: 12px; color: var(--ink-2); }
.coords { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: var(--ink-2); pointer-events: none; font-variant-numeric: tabular-nums; background: rgba(255, 255, 255, .7); padding: 2px 6px; border-radius: 6px; margin-left: 0; transform: translateY(-34px); }
.hint { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: #1b2330; color: #fff; padding: 7px 14px; border-radius: 999px; font-weight: 500; font-size: 12px; box-shadow: var(--shadow); pointer-events: none; opacity: 0; transition: opacity .15s; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
.hint.show { opacity: 1; }
.drop-mask { position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: 14px; background: rgba(79, 70, 229, .06); display: none; align-items: center; justify-content: center; color: var(--accent); font-weight: 700; pointer-events: none; }
.drop-mask.on { display: flex; }

/* ---- tabs ---- */
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; flex: none; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 12px 6px 10px; font-weight: 600; color: var(--ink-3); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.tabpane { display: none; flex: 1; overflow-y: auto; min-height: 0; }
.tabpane.on { display: block; }
.search { padding: 10px 12px 4px; position: sticky; top: 0; background: var(--panel); z-index: 2; }
.search input { width: 100%; height: 34px; border: 1px solid var(--line-2); border-radius: 9px; padding: 0 12px; background: #f8f9fc; }
.search input:focus { outline: none; border-color: var(--accent); background: #fff; }

/* ---- asset library ---- */
.cat { padding: 4px 12px 8px; }
.cat-h { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: transparent; padding: 10px 0 6px; font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.cat-h svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.4; transition: transform .15s; }
.cat.closed .cat-h svg { transform: rotate(-90deg); }
.cat.closed .cards { display: none; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.card { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 4px 3px 6px; text-align: center; cursor: grab; user-select: none; -webkit-user-select: none; transition: border-color .12s, box-shadow .12s, transform .12s; }
.card:hover { border-color: var(--accent); box-shadow: 0 4px 14px rgba(79, 70, 229, .15); transform: translateY(-1px); }
.card:active { cursor: grabbing; }
.card canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 7px; background: linear-gradient(#f4f8fc, #eaf1f8); }
.card span { display: block; font-size: 10.5px; line-height: 1.2; margin-top: 4px; font-weight: 600; color: var(--ink-2); padding: 0 2px; min-height: 25px; }
.card.tool canvas { box-shadow: inset 0 0 0 2px var(--accent-2); }

/* ---- layers / summary ---- */
.layer { display: flex; align-items: center; gap: 4px; padding: 5px 8px 5px 12px; border-bottom: 1px solid #f0f2f6; cursor: pointer; }
.layer:hover { background: #f6f7fb; } .layer.sel { background: var(--accent-2); }
.layer .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; border: 1px solid rgba(0, 0, 0, .15); }
.layer .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.layer .nm small { color: var(--ink-3); font-weight: 400; margin-left: 4px; }
.layer .icon-btn { height: 26px; min-width: 26px; padding: 0 4px; color: var(--ink-3); } .layer .icon-btn.on { color: var(--accent); background: transparent; }
.empty { padding: 28px 18px; text-align: center; color: var(--ink-3); line-height: 1.5; }
.sum-head { padding: 14px 14px 6px; display: flex; gap: 8px; }
.stat { flex: 1; background: #f6f7fb; border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 22px; letter-spacing: -.02em; } .stat span { color: var(--ink-3); font-size: 11px; font-weight: 600; }
.sum-cat { padding: 12px 14px 4px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.sum-row { display: flex; justify-content: space-between; padding: 6px 14px; border-bottom: 1px solid #f0f2f6; }
.sum-row b { font-variant-numeric: tabular-nums; }

/* ---- properties ---- */
#props { padding: 0 0 40px; }
.sec { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.sec h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; display: flex; align-items: center; justify-content: space-between; }
.sec h3 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
.sec .sub { color: var(--ink-3); margin-top: 2px; font-size: 12px; }
.row { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 8px; margin-bottom: 8px; min-height: 30px; }
.row:last-child { margin-bottom: 0; }
.row > label { color: var(--ink-2); font-weight: 500; line-height: 1.2; }
.row input[type=text], .row input[type=number], .row select { width: 100%; height: 30px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 8px; background: #fff; min-width: 0; }
.row input:focus, .row select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-2); }
.row input[type=color] { width: 34px; height: 30px; padding: 2px; border: 1px solid var(--line-2); border-radius: 8px; background: #fff; cursor: pointer; }
.row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.row.two { grid-template-columns: 112px 1fr 1fr; }
.row .colorline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.sw-chip { width: 20px; height: 20px; border-radius: 6px; border: 1px solid rgba(0, 0, 0, .12); cursor: pointer; padding: 0; }
.sw-chip:hover { transform: scale(1.12); }
.switch { position: relative; width: 34px; height: 20px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 2; width: 100%; height: 100%; }
.switch i { position: absolute; inset: 0; background: #cdd4df; border-radius: 99px; transition: .15s; }
.switch i::after { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.switch input:checked + i { background: var(--accent); } .switch input:checked + i::after { transform: translateX(14px); }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
.btnrow .btn { height: 30px; padding: 0 10px; font-size: 12px; }
.hintp { color: var(--ink-3); font-size: 12px; line-height: 1.45; margin: 4px 0 0; }
.kbd { display: inline-block; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font-size: 11px; background: #fafbfd; font-weight: 600; }
.shortcuts .kbd { justify-self: start; }
.shortcuts { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; color: var(--ink-2); }

/* ---- modal ---- */
.modal { position: fixed; inset: 0; background: rgba(15, 20, 35, .5); backdrop-filter: blur(3px); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-card { background: #fff; border-radius: 18px; width: min(980px, 100%); max-height: 100%; overflow: auto; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); padding: 22px 24px 26px; }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.modal-head h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; } .modal-head p { margin: 4px 0 0; color: var(--ink-2); }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.tpl { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; background: #fff; text-align: left; padding: 0; transition: .15s; }
.tpl:hover { border-color: var(--accent); box-shadow: 0 8px 26px rgba(79, 70, 229, .18); transform: translateY(-2px); }
.tpl canvas { display: block; width: 100%; aspect-ratio: 16/10; background: #e9f1f7; }
.tpl .meta { padding: 10px 14px 14px; } .tpl b { display: block; font-size: 14px; } .tpl span { color: var(--ink-2); font-size: 12px; line-height: 1.4; display: block; margin-top: 3px; }

.toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); background: #1b2330; color: #fff; padding: 10px 16px; border-radius: 10px; opacity: 0; pointer-events: none; transition: .2s; z-index: 80; font-weight: 500; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.menu { position: absolute; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; z-index: 60; min-width: 200px; }
.menu button { display: flex; width: 100%; gap: 10px; align-items: center; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; text-align: left; font-weight: 500; }
.menu button:hover { background: #f1f3f9; }
.menu svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; color: var(--ink-2); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* ---- responsive ---- */
@media (max-width: 1100px) {
  #app { grid-template-columns: 250px 1fr 270px; }
  .plan-name { width: 120px; }
}
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; }
  .only-narrow { display: inline-flex; }
  #left, #right { position: absolute; top: 52px; bottom: 0; width: min(330px, 92vw); z-index: 20; box-shadow: var(--shadow); transform: translateX(-105%); transition: transform .2s; }
  #right { right: 0; transform: translateX(105%); }
  #left.open { transform: none; } #right.open { transform: none; }
  .plan-name, .brand span { display: none; }
  #topbar { overflow-x: auto; }
}

</style>
</head>
<body>

  <header id="topbar">
    <div class="brand" title="Venuely">
      <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="8" fill="#4f46e5"/><path d="M16 6l9 5v10l-9 5-9-5V11z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M7 11l9 5 9-5M16 16v10" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Venuely</span>
    </div>
    <input id="planName" class="plan-name" spellcheck="false" aria-label="Plan name">
    <div class="tb-group" id="tbFile"></div>
    <div class="tb-sep"></div>
    <div class="tb-group" id="tbHistory"></div>
    <div class="tb-sep"></div>
    <div class="seg" id="viewSeg" role="tablist" aria-label="View mode">
      <button data-mode="2d" title="Flat 2D plan (2)">2D plan</button>
      <button data-mode="iso" title="Isometric 3D view (3)">Isometric</button>
    </div>
    <div class="tb-group" id="tbView"></div>
    <div class="grow"></div>
    <div class="tb-group" id="tbExport"></div>
    <button class="icon-btn only-narrow" id="btnLeft" title="Library"></button>
    <button class="icon-btn only-narrow" id="btnRight" title="Properties"></button>
  </header>

  <div id="app">
    <aside id="left" class="panel">
      <div class="tabs" id="leftTabs">
        <button data-tab="assets" class="on">Library</button>
        <button data-tab="layers">Layers</button>
        <button data-tab="summary">Summary</button>
      </div>
      <div class="tabpane on" id="paneAssets">
        <div class="search"><input id="assetSearch" placeholder="Search chairs, truss, tents…" spellcheck="false"></div>
        <div id="assetList"></div>
      </div>
      <div class="tabpane" id="paneLayers"></div>
      <div class="tabpane" id="paneSummary"></div>
    </aside>

    <main id="stage">
      <canvas id="cv" tabindex="0"></canvas>
      <div id="toolbar" class="floating"></div>
      <div id="hint" class="hint"></div>
      <div id="zoomBox" class="floating zoombox"></div>
      <div id="coords" class="coords"></div>
      <div id="dropMask" class="drop-mask">Drop to place</div>
    </main>

    <aside id="right" class="panel">
      <div id="props"></div>
    </aside>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <h2>Start a layout</h2>
          <p>Pick a template to customise, or start from a blank plot.</p>
        </div>
        <button class="icon-btn" id="modalClose" title="Close">✕</button>
      </div>
      <div id="tplGrid" class="tpl-grid"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <input type="file" id="fileOpen" accept=".json,application/json" hidden>
